<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API-Grounded Blog Admin</title>
  <style>
    :root {
      /* Fresh minimal color palette */
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      --radius: 8px;
      --transition: all 0.15s ease;
    }

    * { box-sizing: border-box; }
    html, body { 
      margin: 0; padding: 0; 
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; 
      background: var(--bg); color: var(--text-primary); 
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; }

    .app { 
      display: flex; 
      height: 100vh;
      background: var(--bg);
    }

    .workspace {
      width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .brand { 
      padding: 24px 20px; 
      border-bottom: 1px solid var(--border); 
    }
    .brand h1 { 
      margin: 0; 
      font-size: 20px; 
      font-weight: 700;
      color: var(--text-primary);
    }
    .brand p { 
      margin: 4px 0 0; 
      font-size: 13px; 
      color: var(--text-muted); 
    }

    .controls { 
      padding: 16px; 
      border-bottom: 1px solid var(--border); 
    }
    .search {
      width: 100%; 
      border: 1px solid var(--border); 
      background: var(--surface); 
      color: var(--text-primary);
      border-radius: var(--radius); 
      padding: 10px 12px; 
      font-size: 14px;
      transition: var(--transition);
    }
    .search:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(59 130 246 / 0.1);
    }
    .search::placeholder { 
      color: var(--text-muted); 
    }
    .filter-tabs {
      display: flex;
      gap: 1px;
      background: var(--border);
      border-radius: var(--radius);
      padding: 2px;
      margin-top: 12px;
    }
    .filter-tabs button {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      border-radius: calc(var(--radius) - 2px);
      transition: var(--transition);
    }
    .filter-tabs button:hover {
      color: var(--text-primary);
    }
    .filter-tabs button.active {
      background: var(--surface);
      color: var(--accent);
      font-weight: 500;
    }

    .post-list { 
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .post-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: var(--transition);
    }
    .post-item:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }
    .post-item.active {
      border-color: var(--accent);
      background: rgb(59 130 246 / 0.05);
    }
    .post-item h3 { 
      margin: 0 0 6px; 
      font-size: 14px; 
      font-weight: 500;
      color: var(--text-primary);
    }
    .post-meta { 
      display: flex; 
      align-items: center; 
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .status-badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
    }
    .status-badge.draft {
      background: var(--warning);
      color: white;
    }
    .status-badge.published {
      background: var(--success);
      color: white;
    }

    .editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      overflow: hidden;
    }
    .editor-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .editor-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .editor-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn:hover {
      background: var(--bg);
    }
    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .editor-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .form-input, .form-textarea, .form-select {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      padding: 10px 12px;
      border-radius: var(--radius);
      font-size: 14px;
      transition: var(--transition);
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(59 130 246 / 0.1);
    }
    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }
    .title-input {
      font-size: 24px;
      font-weight: 700;
      border: none;
      background: transparent;
      padding: 0;
      width: 100%;
    }
    .title-input:focus {
      outline: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="workspace">
      <div class="brand">
        <h1>Posts</h1>
        <p>Blog management interface</p>
      </div>

      <div class="controls">
        <input type="search" class="search" placeholder="Search posts...">
        <div class="filter-tabs">
          <button class="active" data-filter="all">All</button>
          <button data-filter="draft">Drafts</button>
          <button data-filter="published">Published</button>
        </div>
      </div>

      <div class="post-list" id="postList"></div>
    </aside>

    <main class="editor">
      <header class="editor-header">
        <div class="editor-title" id="editorHeading">Select a post to edit</div>
        <div class="editor-actions">
          <button class="btn" id="newPostBtn">New Post</button>
          <button class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </header>

      <div class="editor-content" id="editorContent">
        <div class="form-group">
          <input type="text" class="title-input form-input" id="title" placeholder="Post title">
        </div>
        
        <div class="form-group">
          <label class="form-label">Content</label>
          <textarea class="form-textarea" id="content" placeholder="Write your post content here..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Excerpt</label>
          <textarea class="form-textarea" id="excerpt" placeholder="Brief description of the post"></textarea>
        </div>
      </div>
    </main>
  </div>

  <script>
    const posts = [
      {
        id: 1,
        title: 'Getting Started with Blogging',
        slug: 'getting-started',
        excerpt: 'Learn the basics of creating engaging blog content.',
        content: 'Content goes here...',
        status: 'published'
      },
      {
        id: 2,
        title: 'Advanced Writing Techniques',
        slug: 'advanced-writing',
        excerpt: 'Take your writing skills to the next level.',
        content: 'Content goes here...',
        status: 'draft'
      },
      {
        id: 3,
        title: 'SEO Best Practices',
        slug: 'seo-best-practices',
        excerpt: 'Optimize your content for search engines.',
        content: 'Content goes here...',
        status: 'published'
      }
    ];

    let currentPost = null;
    let currentFilter = 'all';

    const postList = document.getElementById('postList');
    const editorHeading = document.getElementById('editorHeading');
    const titleInput = document.getElementById('title');
    const contentInput = document.getElementById('content');
    const excerptInput = document.getElementById('excerpt');
    const searchInput = document.querySelector('.search');

    function renderPosts() {
      const filteredPosts = posts.filter(post => {
        if (currentFilter === 'all') return true;
        return post.status === currentFilter;
      });

      const searchTerm = searchInput.value.toLowerCase();
      const searchFiltered = filteredPosts.filter(post => 
        post.title.toLowerCase().includes(searchTerm) ||
        post.slug.toLowerCase().includes(searchTerm)
      );

      postList.innerHTML = searchFiltered.map(post => `
        <div class="post-item ${currentPost?.id === post.id ? 'active' : ''}" data-id="${post.id}">
          <h3>${post.title}</h3>
          <div class="post-meta">
            <span class="status-badge ${post.status}">${post.status}</span>
            <span>${post.slug}</span>
          </div>
        </div>
      `).join('');

      postList.querySelectorAll('.post-item').forEach(item => {
        item.addEventListener('click', () => {
          const postId = parseInt(item.dataset.id);
          currentPost = posts.find(p => p.id === postId);
          loadPost();
          renderPosts();
        });
      });
    }

    function loadPost() {
      if (currentPost) {
        editorHeading.textContent = `Editing: ${currentPost.title}`;
        titleInput.value = currentPost.title;
        contentInput.value = currentPost.content;
        excerptInput.value = currentPost.excerpt;
      } else {
        editorHeading.textContent = 'Select a post to edit';
        titleInput.value = '';
        contentInput.value = '';
        excerptInput.value = '';
      }
    }

    function savePost() {
      if (currentPost && titleInput.value.trim()) {
        currentPost.title = titleInput.value.trim();
        currentPost.content = contentInput.value;
        currentPost.excerpt = excerptInput.value.trim();
        renderPosts();
      }
    }

    function newPost() {
      currentPost = {
        id: Date.now(),
        title: '',
        slug: '',
        excerpt: '',
        content: '',
        status: 'draft'
      };
      posts.unshift(currentPost);
      loadPost();
      renderPosts();
    }

    // Event listeners
    document.getElementById('newPostBtn').addEventListener('click', newPost);
    document.getElementById('saveBtn').addEventListener('click', savePost);
    
    searchInput.addEventListener('input', renderPosts);

    document.querySelectorAll('.filter-tabs button').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.filter-tabs button').forEach(b => b.classList.remove('active'));
        button.classList.add('active');
        currentFilter = button.dataset.filter;
        renderPosts();
      });
    });

    // Auto-save on input
    [titleInput, contentInput, excerptInput].forEach(input => {
      input.addEventListener('input', () => {
        if (currentPost) {
          savePost();
        }
      });
    });

    // Initial render
    renderPosts();
  </script>
</body>
</html>
